<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
	  xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">


<head>
<meta charset="UTF-8">
<title>Index page</title>
<link th:href="@{/css/styles.css}" rel="stylesheet">

</head>
<body>
	<h1>Welcome to the Library Database!</h1>
	<table>
	<tr><th>Title</th><th>Author</th><th>Reviews</th>
	<tr th:each="b : ${bookList}">
	<td th:text="${b.title}>"></td>
	<td th:text="${b.author}>"></td>
	
	<td><a th:href="@{/viewBook/}+${b.id}">Review</a></td> <!-- Go to view-book.html -->
	</tr>
	</table>
	<div sec:authorize="isAuthenticated()">
	<a th:href="@{/addBook}">Add a Book</a> <!-- go to add-book.html -->
	</div>
	
	

	<p> Login <a href="/login" th:href="@{/login}">here</a>.</p><!-- Go to login.html -->
		<div sec:authorize="isAuthenticated()">
		<form method="post"><input type="submit" value="Logout" th:action="@{/logout}"></form> <!-- go to index.html -->
		</div>
	
</body>
</html>
