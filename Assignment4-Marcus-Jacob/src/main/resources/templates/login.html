<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login Page</title>
<link th:href="@{/css/mycss.css}" rel="stylesheet">
</head>
<body>
	<h1>Please enter below information to log in.</h1>
	
	<form method="post"  th:action="@{/login}" action="#">
	
	<div th:if="${param.error}" class="error">Invalid User Name</div>
	
	<div th:if="${param.logout}" class="logout">You have been logged out</div>
	
	Email       :<input type="email"      name="username"><br>
	Password    :<input type="password"   name="password"><br>
	
	<input type="submit"  value="Log In">	
	</form>
	<p> Not registered? register <a href="/register" th:href="@{/register}"> here</a>.</p>
	<a href="/index" th:href="@{/index}">Return to Index</a>
	
	
</body>
</html>
